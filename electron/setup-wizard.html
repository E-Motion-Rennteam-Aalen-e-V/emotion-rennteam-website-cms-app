<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Motion CMS – Einrichtung</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fb923c 0%, #a3e635 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wizard {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .wizard-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .wizard-header h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    .wizard-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #fb923c;
      box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.1);
    }

    .form-help {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
      line-height: 1.4;
    }

    .form-help a {
      color: #fb923c;
      text-decoration: none;
    }

    .form-help a:hover {
      text-decoration: underline;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 40px;
    }

    button {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #fb923c, #a3e635);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(251, 146, 60, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      display: block;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      display: block;
    }

    .status.info {
      background: #e3f2fd;
      color: #1565c0;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fb923c;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="wizard">
    <div class="wizard-header">
      <h1>🚀 E-Motion CMS</h1>
      <p>Willkommen! Bitte konfiguriere GitHub.</p>
    </div>

    <div id="status" class="status"></div>

    <form id="setupForm">
      <div class="form-group">
        <label for="githubToken">GitHub Token *</label>
        <input
          type="password"
          id="githubToken"
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          required
        />
        <div class="form-help">
          <a href="#" onclick="window.electronAPI.openExternalUrl('https://github.com/settings/personal-access-tokens/new'); return false;">
            Neuen Token erstellen →
          </a>
          <br />
          Benötigte Berechtigungen: repo (Contents: Read and write)
        </div>
      </div>

      <div class="form-group">
        <label for="githubOwner">GitHub Owner *</label>
        <input type="text" id="githubOwner" placeholder="e-motion-rennteam-aalen-e-v" required />
        <div class="form-help">Dein GitHub Benutzer oder Organization</div>
      </div>

      <div class="form-group">
        <label for="githubRepo">GitHub Repository *</label>
        <input
          type="text"
          id="githubRepo"
          placeholder="emotion-rennteam-website-cms-app"
          required
        />
        <div class="form-help">Repo-Name (ohne Owner-Prefix)</div>
      </div>

      <div class="form-group">
        <label for="githubBranch">Branch</label>
        <input type="text" id="githubBranch" placeholder="main" value="main" />
        <div class="form-help">Standard: main</div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-secondary" onclick="window.close()">
          Abbrechen
        </button>
        <button type="submit" class="btn-primary" id="submitBtn">
          Speichern & Starten
        </button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const config = {
        GITHUB_TOKEN: document.getElementById('githubToken').value,
        GITHUB_OWNER: document.getElementById('githubOwner').value,
        GITHUB_REPO: document.getElementById('githubRepo').value,
        GITHUB_BRANCH: document.getElementById('githubBranch').value || 'main',
      };

      // Validiere Token
      submitBtn.disabled = true;
      showStatus('Token wird validiert...', 'info');

      const testResult = await window.electronAPI.testToken(config.GITHUB_TOKEN);

      if (!testResult.success) {
        showStatus(`❌ Token-Validierung fehlgeschlagen: ${testResult.error}`, 'error');
        submitBtn.disabled = false;
        return;
      }

      // Speichere Config
      const result = await window.electronAPI.saveConfig(config);

      if (result.success) {
        showStatus('✅ Konfiguration gespeichert! Starte CMS...', 'success');
        submitBtn.textContent = '✓ Speichern & Starten';
        setTimeout(() => {
          window.close();
        }, 1500);
      } else {
        showStatus(`❌ Fehler beim Speichern: ${result.error}`, 'error');
        submitBtn.disabled = false;
      }
    });

    // Lade existierende Config, wenn vorhanden
    window.electronAPI.getConfig().then((config) => {
      if (config.GITHUB_TOKEN) {
        document.getElementById('githubToken').value = config.GITHUB_TOKEN;
        document.getElementById('githubOwner').value = config.GITHUB_OWNER || '';
        document.getElementById('githubRepo').value = config.GITHUB_REPO || '';
        document.getElementById('githubBranch').value = config.GITHUB_BRANCH || 'main';
      }
    });
  </script>
</body>
</html>
